# Le plan gratuit de Supabase met en pause un projet resté sans activité pendant une semaine.
# Cette tâche interroge la base deux fois par semaine pour que le suivi reste disponible au scan du QR code.
name: Garder le suivi actif
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Interroger Supabase
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" config.js || true)
          KEY=$(grep -oP "supabaseAnonKey:\s*'\K[^']+" config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase non configuré : rien à faire."; exit 0; fi
          curl -fsS "$URL/rest/v1/ouvrages?select=ref,statut&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
