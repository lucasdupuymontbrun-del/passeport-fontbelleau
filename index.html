<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passeports numériques — Domaine de Fontbelleau</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .reg { max-width: 760px; margin: 0 auto; padding: 48px var(--gut); }
  .reg h1 { font-family: var(--mark); font-size: clamp(48px, 10vw, 88px); line-height: .9; margin: 0 0 16px; }
  .reg p { color: var(--ardoise); max-width: 56ch; }
  .reg ul { list-style: none; padding: 0; margin: 28px 0 0; border-top: 1px solid var(--trait); }
  .reg li a { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 4px; border-bottom: 1px solid var(--trait); text-decoration: none; }
  .reg li a:hover { background: var(--papier); }
  .reg strong { font-size: 20px; font-weight: 800; font-stretch: 85%; }
  .reg span { color: var(--ardoise); }
</style>
</head>
<body>
<main class="reg">
  <img src="assets/img/veck-construction-640.png" width="320" height="60" alt="Veck Construction" style="height:44px;width:auto;margin-bottom:28px">
  <h1>Fontbelleau</h1>
  <p>Passeports numériques des ouvrages du chantier. Chaque ouvrage porte un QR code qui ouvre directement sa fiche.</p>
  <ul>
    <li><a href="A2-PM106/"><strong>A2 PM 106</strong><span>Ouvrir</span><span>Prémur du noyau central, tour A2, étage R+1</span></a></li>
  </ul>
</main>
</body>
</html>
